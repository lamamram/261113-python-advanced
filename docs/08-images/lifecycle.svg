<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <!-- Flèches -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <!-- Ombre légère -->
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    .bg { fill: #f8fafc; }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
    .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
    .box-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
    .badge { font-family: monospace; font-size: 11px; font-weight: 700; }
  </style>

  <!-- Fond -->
  <rect width="920" height="680" class="bg" rx="12" />

  <!-- En-tête -->
  <text x="460" y="38" text-anchor="middle" class="title">Cycle de vie complet d'une application FastAPI</text>
  <text x="460" y="58" text-anchor="middle" class="subtitle">De l'initialisation (Lifespan) au traitement d'une requête HTTP</text>

  <!-- ========================================== -->
  <!-- 1. LIFESPAN (ENVELOPPE APPLICATION)        -->
  <!-- ========================================== -->
  <rect x="30" y="80" width="860" height="575" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2" stroke-dasharray="8,4" />
  <rect x="45" y="68" width="250" height="24" rx="6" fill="#4f46e5" />
  <text x="170" y="84" text-anchor="middle" class="badge" fill="#ffffff">LIFESPAN (Cycle de vie serveur)</text>

  <!-- Lifespan : Startup -->
  <g filter="url(#shadow)">
    <rect x="55" y="108" width="170" height="90" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
    <text x="140" y="132" text-anchor="middle" class="box-title" fill="#312e81">1. Startup</text>
    <text x="140" y="150" text-anchor="middle" class="box-desc" fill="#475569">Code avant yield</text>
    <text x="140" y="166" text-anchor="middle" class="box-desc" fill="#64748b">(Pools BDD, modèles ML,</text>
    <text x="140" y="180" text-anchor="middle" class="box-desc" fill="#64748b">clients HTTP partagés)</text>
  </g>

  <!-- Lifespan : Shutdown -->
  <g filter="url(#shadow)">
    <rect x="55" y="535" width="170" height="90" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
    <text x="140" y="559" text-anchor="middle" class="box-title" fill="#312e81">10. Shutdown</text>
    <text x="140" y="577" text-anchor="middle" class="box-desc" fill="#475569">Code après yield</text>
    <text x="140" y="593" text-anchor="middle" class="box-desc" fill="#64748b">(Fermeture connexions,</text>
    <text x="140" y="607" text-anchor="middle" class="box-desc" fill="#64748b">libération mémoire)</text>
  </g>

  <!-- Flèche Startup -> Zone Requête -->
  <path d="M 225 153 L 265 153" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow-slate)" />
  <text x="245" y="143" text-anchor="middle" class="box-desc" fill="#475569">Prêt</text>

  <!-- Flèche Zone Requête -> Shutdown -->
  <path d="M 265 580 L 225 580" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow-slate)" />
  <text x="245" y="570" text-anchor="middle" class="box-desc" fill="#475569">Arrêt</text>

  <!-- ========================================== -->
  <!-- 2. ZONE REQUÊTE HTTP (BOUCLE PAR REQUÊTE)  -->
  <!-- ========================================== -->
  <rect x="275" y="102" width="595" height="532" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="290" y="92" width="235" height="22" rx="6" fill="#334155" />
  <text x="407" y="107" text-anchor="middle" class="badge" fill="#ffffff">CYCLE D'UNE REQUÊTE HTTP</text>

  <!-- En-têtes colonnes Entrée / Sortie -->
  <text x="415" y="135" text-anchor="middle" class="box-title" fill="#2563eb">⬇ PHASE ENTRANTE (Requête)</text>
  <text x="730" y="135" text-anchor="middle" class="box-title" fill="#059669">⬆ PHASE SORTANTE (Réponse)</text>

  <!-- ================= COLONNE GAUCHE : ENTRÉE ================= -->

  <!-- 2. Middleware Entrée -->
  <g filter="url(#shadow)">
    <rect x="305" y="150" width="220" height="65" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="415" y="172" text-anchor="middle" class="box-title" fill="#1e3a8a">2. Middlewares (Entrée)</text>
    <text x="415" y="190" text-anchor="middle" class="box-desc" fill="#1e40af">Interception brute (CORS, logs, temps)</text>
    <text x="415" y="204" text-anchor="middle" class="box-desc" fill="#3b82f6">Avant routage et lecture du body</text>
  </g>
  <path d="M 415 215 L 415 240" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />

  <!-- 3. Routage -->
  <g filter="url(#shadow)">
    <rect x="305" y="245" width="220" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="415" y="267" text-anchor="middle" class="box-title" fill="#1e3a8a">3. Routage (Routing)</text>
    <text x="415" y="285" text-anchor="middle" class="box-desc" fill="#1e40af">Correspondance URL + Méthode HTTP</text>
    <text x="415" y="298" text-anchor="middle" class="box-desc" fill="#3b82f6">(Sinon erreur 404 / 405)</text>
  </g>
  <path d="M 415 305 L 415 330" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />

  <!-- 4. Depends (Entrée) -->
  <g filter="url(#shadow)">
    <rect x="305" y="335" width="220" height="65" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="415" y="357" text-anchor="middle" class="box-title" fill="#1e3a8a">4. Dépendances (Depends)</text>
    <text x="415" y="375" text-anchor="middle" class="box-desc" fill="#1e40af">Exécution avant yield</text>
    <text x="415" y="389" text-anchor="middle" class="box-desc" fill="#3b82f6">(Auth, session BDD, permissions)</text>
  </g>
  <path d="M 415 400 L 415 425" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />

  <!-- 5. Validation Pydantic -->
  <g filter="url(#shadow)">
    <rect x="305" y="430" width="220" height="65" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="415" y="452" text-anchor="middle" class="box-title" fill="#1e3a8a">5. Validation Schémas</text>
    <text x="415" y="470" text-anchor="middle" class="box-desc" fill="#1e40af">Parsing &amp; validation Pydantic</text>
    <text x="415" y="484" text-anchor="middle" class="box-desc" fill="#3b82f6">(Sinon erreur 422)</text>
  </g>

  <!-- ================= CENTRE BAS : GESTIONNAIRE ================= -->

  <!-- Flèche Validation -> Gestionnaire -->
  <path d="M 415 495 L 415 535 L 455 535" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />

  <!-- 6. Gestionnaire de route -->
  <g filter="url(#shadow)">
    <rect x="460" y="510" width="225" height="68" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <text x="572" y="534" text-anchor="middle" class="box-title" fill="#92400e">6. Gestionnaire (Endpoint)</text>
    <text x="572" y="552" text-anchor="middle" class="box-desc" fill="#b45309">Exécution de votre fonction de route</text>
    <text x="572" y="566" text-anchor="middle" class="box-desc" fill="#d97706">(Logique métier &amp; retour objet)</text>
  </g>

  <!-- Flèche Gestionnaire -> Sérialisation -->
  <path d="M 685 535 L 730 535 L 730 498" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />

  <!-- ================= COLONNE DROITE : SORTIE ================= -->

  <!-- 7. Sérialisation -->
  <g filter="url(#shadow)">
    <rect x="620" y="430" width="220" height="65" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
    <text x="730" y="452" text-anchor="middle" class="box-title" fill="#065f46">7. Sérialisation</text>
    <text x="730" y="470" text-anchor="middle" class="box-desc" fill="#047857">Filtrage via response_model</text>
    <text x="730" y="484" text-anchor="middle" class="box-desc" fill="#10b981">Conversion en JSON</text>
  </g>
  <path d="M 730 430 L 730 403" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />

  <!-- 8. Depends (Sortie) -->
  <g filter="url(#shadow)">
    <rect x="620" y="335" width="220" height="65" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
    <text x="730" y="357" text-anchor="middle" class="box-title" fill="#065f46">8. Dépendances (Nettoyage)</text>
    <text x="730" y="375" text-anchor="middle" class="box-desc" fill="#047857">Exécution après yield</text>
    <text x="730" y="389" text-anchor="middle" class="box-desc" fill="#10b981">(Fermeture session BDD)</text>
  </g>
  <path d="M 730 335 L 730 308" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />

  <!-- 9. Middleware Sortie -->
  <g filter="url(#shadow)">
    <rect x="620" y="245" width="220" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
    <text x="730" y="267" text-anchor="middle" class="box-title" fill="#065f46">9. Middlewares (Sortie)</text>
    <text x="730" y="285" text-anchor="middle" class="box-desc" fill="#047857">Ordre inverse (ajout headers,</text>
    <text x="730" y="298" text-anchor="middle" class="box-desc" fill="#10b981">calcul temps de réponse)</text>
  </g>
</svg>